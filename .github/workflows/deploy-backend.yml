name: Deploy backend to Hugging Face Space

# Copies backend/ into a Hugging Face Docker Space, which then builds and runs it.
# One-time setup (see docs/DEPLOYMENT.md):
#   Repository variable  HF_SPACE  = <hf-username>/<space-name>
#   Repository secret    HF_TOKEN  = a Hugging Face access token with write permission
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/huggingface/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    # Skipped until the HF_SPACE variable is set
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync backend/ into the Space repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -euo pipefail
          HF_USER="${HF_SPACE%%/*}"
          git clone "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space

          rsync -a --delete \
            --exclude '.git' --exclude '.gitattributes' \
            --exclude '.env' --exclude 'media' --exclude 'staticfiles' \
            --exclude '__pycache__' --exclude '*.pyc' \
            backend/ space/
          cp deploy/huggingface/README.md space/README.md

          cd space
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Space is already up to date."
          else
            git commit -m "Deploy backend from ${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi
