# One-command local stack:  cp .env.example .env  (fill it in)  &&  docker compose up --build
# Frontend: http://localhost:3000   Backend API: http://localhost:8000/api/health/
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowflow_ai
      POSTGRES_USER: knowflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowflow -d knowflow_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://knowflow:${DB_PASSWORD}@db:5432/knowflow_ai
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  media:
