server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routes: unknown paths must fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
